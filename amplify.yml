# Amplify Hosting build spec (optional CI path).
# Prefer local `npm run build` + `npm run deploy:web` to avoid always-on builders.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
